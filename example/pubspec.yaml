name: litert_crypto_example
description: Runnable demo for litert_crypto — decrypts a bundled encrypted asset in memory.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  litert_crypto:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# --- Repro for google/webcrypto.dart#325: absolute Windows `localPath` is
# --- parsed as a URI ("Cannot extract a file path from a d URI").
# --- On Windows run:  dart run litert_crypto encrypt   (any hook-triggering
# --- command works; the dll path does not need to exist — parsing fails
# --- before the existence check). Pinned to the PR head at the time tested.
dependency_overrides:
  webcrypto:
    git:
      url: https://github.com/mosuem/webcrypto.dart
      ref: b2127e3afe74c00d22b4a84e7bc7ed785ae39a37

hooks:
  user_defines:
    webcrypto:
      buildMode: local
      localPath: D:\any\path\webcrypto.dll

# Model-encryption config — no separate litert_crypto.yaml needed.
# Run `dart run litert_crypto encrypt` after changing a model.
litert_crypto:
  key_file: .secrets/model_master.key
  key_parts_out: lib/model_master_key.dart
  models:
    - src: models_src/demo_model.bin
      out: assets/tflite_model/demo_model.bin.enc

flutter:
  uses-material-design: true
  assets:
    # Only the encrypted output ships; the plaintext source stays in models_src/.
    - assets/tflite_model/demo_model.bin.enc
