name: litert_crypto
description: "Stop shipping your .tflite in plain sight. Encrypt LiteRT (TFLite) models at build time and decrypt them in memory only — with pluggable key providers."
version: 0.2.1
repository: https://github.com/cornpip/litert_crypto

# Floor set by webcrypto ^0.6.1 (Dart hooks)
environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

topics:
  - litert
  - tflite
  - encryption
  - security

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  webcrypto: ^0.6.1
  args: ^2.6.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
