name: litert_crypto
description: "Stop shipping your .tflite in plain sight. Encrypt LiteRT (TFLite) models at build time and decrypt them in memory only — with pluggable key providers."
version: 0.1.0
repository: https://github.com/cornpip/litert_crypto

# Floor verified: analyze + full test suite pass on Flutter 3.32.7 / Dart 3.8.1.
environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

topics:
  - litert
  - tflite
  - encryption
  - security

# No web: dart:io aside, the threat model needs a bundle boundary — on the web
# the code, the assets, and any embedded key are all served in the clear.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  # CLI-only dependencies (used from the Flutter-free entrypoint).
  args: ^2.6.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
