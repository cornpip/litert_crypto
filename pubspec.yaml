name: litert_crypto
description: "Encrypt and load LiteRT (TensorFlow Lite / TFLite) models. Build-time encryption CLI plus in-memory decryption loader with pluggable key providers."
version: 0.0.1
# NOTE: create this repository before the first real publish.
repository: https://github.com/cornpip/litert_crypto

environment:
  sdk: ^3.8.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  cryptography: ^2.7.0
  # RemoteKeyProvider transport (pure Dart, works on every platform).
  http: ^1.2.0
  # CLI-only dependencies (used from the Flutter-free entrypoint).
  args: ^2.6.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
